<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FORMA TALENTO | Inicio de Sesión</title>

    <link rel="stylesheet"
          href="CSS/estilos_index.css">

</head>

<body>

    <div class="login-container">

        <h1>FORMA TALENTO</h1>

        <h2>Sistema DNC</h2>

        <form id="loginForm">

            <input
                type="text"
                id="usuario"
                placeholder="Usuario"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
                required
            >

            <button type="submit">
                Iniciar Sesión
            </button>

        </form>

    </div>

    <!-- ===================================================== -->
    <!-- CONFIGURACIÓN                                         -->
    <!-- ===================================================== -->

    <script src="JS/config/storageKeys.js"></script>

    <script src="JS/config/appConfig.js"></script>

    <!-- ===================================================== -->
    <!-- UTILIDADES                                            -->
    <!-- ===================================================== -->

    <script src="JS/utils/storage.js"></script>

    <script src="JS/utils/helpers.js"></script>

    <script src="JS/utils/idGenerator.js"></script>

    <!-- ===================================================== -->
    <!-- DATOS / CATÁLOGOS V1.1                                -->
    <!-- ===================================================== -->

    <script src="JS/data/rolesData.js"></script>

    <script src="JS/data/areasData.js"></script>

    <script src="JS/data/puestosData.js"></script>

    <script src="JS/data/competenciasData.js"></script>

    <script src="JS/data/categoriasData.js"></script>

    <script src="JS/data/prioridadesData.js"></script>

    <script src="JS/data/cursosData.js"></script>

    <script src="JS/data/usuariosData.js"></script>

    <script src="JS/data/cuestionariosData.js"></script>

    <script src="JS/data/preguntasData.js"></script>

    <script src="JS/data/asignacionesData.js"></script>

    <script src="JS/data/resultadosData.js"></script>

    <script src="JS/data/respuestasData.js"></script>

    <!-- ===================================================== -->
    <!-- SERVICIOS                                             -->
    <!-- ===================================================== -->

    <script src="JS/services/BootstrapService.js"></script>

    <script src="JS/services/UsuariosService.js"></script>

    <!-- ===================================================== -->
    <!-- AUTENTICACIÓN                                         -->
    <!-- ===================================================== -->

    <script src="JS/auth/auth.js"></script>

    <script src="JS/auth/permisos.js"></script>

    <!-- ===================================================== -->
    <!-- PÁGINA                                                -->
    <!-- ===================================================== -->

    <script src="JS/pages/login.js"></script>

</body>

</html>
