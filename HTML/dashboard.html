<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FORMA TALENTO | Dashboard</title>

    <link rel="stylesheet"
          href="../CSS/estilos_dashboard.css">

</head>

<body>

    <div class="dashboard">

        <!-- ========================================== -->
        <!-- MENÚ LATERAL                               -->
        <!-- ========================================== -->

        <aside class="sidebar">

            <div class="logo">
                FORMA TALENTO
            </div>

            <ul class="menu">

                <li class="active">

                    <a href="dashboard.html">
                        Dashboard
                    </a>

                </li>

                <li id="menu-usuarios" data-rol-admin>

                    <a href="usuarios.html">
                        Usuarios
                    </a>

                </li>

                <li id="menu-cuestionarios">

                    <a href="cuestionarios.html">
                        Cuestionarios
                    </a>

                </li>

                <li id="menu-resultados" data-rol-admin-supervisor>

                    <a href="resultados.html">
                        Resultados
                    </a>

                </li>

                <li>

                    <a href="#"
                       onclick="cerrarSesion()">
                        Cerrar Sesión
                    </a>

                </li>

            </ul>

        </aside>

        <!-- ========================================== -->
        <!-- CONTENIDO PRINCIPAL                        -->
        <!-- ========================================== -->

        <div class="main-content">

            <header class="topbar">

                <h2>
                    Panel de Control
                </h2>

                <div class="usuario"
                     id="usuarioInfo">
                </div>

            </header>

            <main class="contenido">

                <h1>
                    Resumen General
                </h1>

                <div class="tarjetas">

                    <div class="tarjeta" data-rol-admin>

                        <h3>
                            Usuarios
                        </h3>

                        <p id="totalUsuarios">
                            0
                        </p>

                    </div>

                    <div class="tarjeta">

                        <h3>
                            Cuestionarios
                        </h3>

                        <p id="totalCuestionarios">
                            0
                        </p>

                    </div>

                    <div class="tarjeta">

                        <h3>
                            Resultados
                        </h3>

                        <p id="totalResultados">
                            0
                        </p>

                    </div>

                    <div class="tarjeta">

                        <h3>
                            Pendientes
                        </h3>

                        <p id="totalPendientes">
                            0
                        </p>

                    </div>

                </div>

                <section class="seccion-cursos">

    <h2>
        Cursos recomendados
    </h2>

    <div id="contenedorCursosDashboard"
         class="contenedor-cursos-dashboard">
    </div>

</section>

            </main>

        </div>

    </div>

    <!-- ===================================================== -->
    <!-- CONFIGURACIÓN                                         -->
    <!-- ===================================================== -->

    <script src="../JS/config/storageKeys.js"></script>

    <script src="../JS/config/appConfig.js"></script>

    <!-- ===================================================== -->
    <!-- UTILIDADES                                            -->
    <!-- ===================================================== -->

    <script src="../JS/utils/storage.js"></script>

    <script src="../JS/utils/helpers.js"></script>

    <script src="../JS/utils/idGenerator.js"></script>

    <!-- ===================================================== -->
    <!-- DATOS / CATÁLOGOS V1.1                                -->
    <!-- ===================================================== -->

    <script src="../JS/data/rolesData.js"></script>

    <script src="../JS/data/areasData.js"></script>

    <script src="../JS/data/puestosData.js"></script>

    <script src="../JS/data/competenciasData.js"></script>

    <script src="../JS/data/categoriasData.js"></script>

    <script src="../JS/data/prioridadesData.js"></script>

    <script src="../JS/data/cursosData.js"></script>

    <script src="../JS/data/usuariosData.js"></script>

    <script src="../JS/data/cuestionariosData.js"></script>

    <script src="../JS/data/preguntasData.js"></script>

    <script src="../JS/data/asignacionesData.js"></script>

    <script src="../JS/data/resultadosData.js"></script>

    <script src="../JS/data/respuestasData.js"></script>

    <!-- ===================================================== -->
    <!-- SERVICIOS                                             -->
    <!-- ===================================================== -->

    <script src="../JS/services/BootstrapService.js"></script>

    <script src="../JS/services/usuariosService.js"></script>

    <script src="../JS/services/CuestionariosService.js"></script>

    <script src="../JS/services/AsignacionesService.js"></script>

    <script src="../JS/services/resultadosService.js"></script>

    <!-- ===================================================== -->
    <!-- AUTENTICACIÓN Y PERMISOS                              -->
    <!-- ===================================================== -->

    <script src="../JS/auth/auth.js"></script>

    <script src="../JS/auth/permisos.js"></script>

    <!-- ===================================================== -->
    <!-- PÁGINA                                                -->
    <!-- ===================================================== -->

    <script src="../JS/pages/dashboard.js"></script>

</body>

</html>
